name: my_english_chat
description: MyEnglishChat Flutter client (Android + iOS).
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.7.0

  # On-device TTS (Piper via ONNX Runtime)
  runanywhere: ^0.16.0
  runanywhere_onnx: ^0.16.0

  # Audio record / playback (placeholders for next iteration)
  # 6.x 与当前 record_platform_interface 对齐；5.x 的 record_linux 会编译失败
  record: ^6.2.0
  just_audio: ^0.9.40
  flutter_tts: ^3.8.5

  google_fonts: ^6.2.1

  path: ^1.9.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

