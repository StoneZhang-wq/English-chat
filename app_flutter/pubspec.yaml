name: my_english_chat
description: MyEnglishChat Flutter client (Android + iOS).
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.7.0

  # On-device TTS (KittenTTS / KittenML ONNX, MIT)
  flutter_kitten_tts: ^0.0.4

  # Audio record / playback (placeholders for next iteration)
  # 6.x 与当前 record_platform_interface 对齐；5.x 的 record_linux 会编译失败
  record: ^6.2.0
  just_audio: ^0.9.40
  flutter_tts: ^4.1.0

  google_fonts: ^6.2.1

  path: ^1.9.0
  path_provider: ^2.1.5

  # 离线 ASR（Vosk）；使用 vendored 副本以去掉损坏的 Web 插件注册，便于 `flutter run -d chrome` 编译。
  vosk_flutter_service:
    path: third_party/vosk_flutter_service
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/

