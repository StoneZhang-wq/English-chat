<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>场景列表</title>
  <style>
    body { font-family: Inter, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#fafaf9; color:#1c1917; padding:24px; }
    h1 { font-family: "Times New Roman", Georgia, "Noto Serif SC", serif; font-style: italic; font-size: 42px; margin-bottom: 12px; }
    .scene-card { display:inline-block; width:300px; margin:12px; background:#fff; border:1px solid #e7e5e4; border-radius:32px; overflow:hidden; text-align:center; box-shadow:0 1px 2px rgba(28,25,23,0.04); transition: all .25s ease;}
    .scene-card:hover { transform: translateY(-2px); border-color:#1c1917; box-shadow:0 14px 24px rgba(28,25,23,0.1); }
    .scene-card img{width:100%; height:180px; object-fit:cover;}
    .scene-card h3{margin:16px 0; font-family: "Times New Roman", Georgia, "Noto Serif SC", serif; font-style: italic; font-size: 28px;}
    .enter-btn{display:inline-block;margin-bottom:20px;padding:10px 18px;background:#d97706;color:#fff;border-radius:999px;text-decoration:none;font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;}
    .enter-btn:hover{background:#b45309;}
  </style>
</head>
<body>
  <h1>可进入的场景</h1>
  <div id="scenes">
    {% for s in scenes %}
      <div class="scene-card">
        <img src="{{ s.image }}" alt="{{ s.title }}" />
        <h3>{{ s.title }}</h3>
        <a class="enter-btn" href="/scene/{{ s.id }}">进入场景</a>
      </div>
    {% endfor %}
  </div>
</body>
</html>
